# tmux — terminal multiplexer (depends on libevent, bison)
pkg_name=tmux
pkg_version=3.7b
pkg_type=tarball
pkg_src_dir=tmux-3.7b
pkg_url=https://github.com/tmux/tmux/releases/download/3.7b/tmux-3.7b.tar.gz
pkg_tarball=tmux-3.7b.tar.gz
pkg_sha256=87f2e99e3b685973f2ca002ffd6ed7e51a5744f7009daae5a15670b6d532db96
pkg_build=autotools
pkg_prefix=tmux
pkg_bin=tmux
# tmux takes -V; `tmux --version` prints usage. Used by the install gate
# (ensure_source_pkgs) and by check_parity/review_packages to confirm that
# what is on PATH really is this build, not the distro's older package.
pkg_version_args=(-V)
pkg_deps=(libevent bison)
pkg_configure_args=()