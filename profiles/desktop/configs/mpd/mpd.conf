# MPD configuration — user service (systemctl --user)
# See: man mpd.conf(5)

# Files and directories
music_directory      "~/Music"
playlist_directory   "~/.local/share/mpd/playlists"
db_file              "~/.local/share/mpd/database"
state_file           "~/.local/state/mpd/state"
sticker_file         "~/.local/share/mpd/sticker.sql"

# Network
bind_to_address      "127.0.0.1"
port                 "6600"

# Symbolic links — allows accessing music from multiple directories
# via symlinks in ~/Music/ that point elsewhere (e.g. SD_Music, /media/*)
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

# Database
auto_update          "yes"
auto_update_depth    "3"

# Playback
restore_paused       "yes"
save_absolute_paths_in_playlists "no"

# Metadata
metadata_to_use      "artist,album,title,track,name,genre,date,composer,performer,disc"

# Audio output — PipeWire (native)
audio_output {
    type             "pipewire"
    name             "PipeWire Output"
}

# Input
input {
    plugin           "curl"
}

# Logging — systemd journal is used by default with --systemd flag
# log_level "verbose"  # uncomment for troubleshooting
