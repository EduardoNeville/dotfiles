; light.ini — fast-syntax-highlighting theme matching the Catppuccin Latte
; palette (see configs/wezterm/wezterm.lua light scheme). Loaded via
; `fast-theme CONFIG:light` from the theme-zsh.zsh hook.
;
; Fixes the "background same colour as the text" issue on light terminals:
; every `bg:` style uses a light-gray background (#ccd0da) with a dark
; foreground so text stays readable; no dark-background styles remain.

[base]
default          = none
unknown-token    = #d20f39,bold
commandseparator = none
redirection      = none
here-string-tri  = #df8e1d
here-string-text = #179299
here-string-var  = #179299,bg:#ccd0da
exec-descriptor  = #df8e1d,bold
comment          = #000000,bold
correct-subtle   = #1e66f5
incorrect-subtle = #d20f39
subtle-separator = #40a02b
subtle-bg        = bg:#ccd0da
secondary        = free

[command-point]
reserved-word  = #df8e1d
subcommand     = #df8e1d
alias          = #40a02b
suffix-alias   = #40a02b
global-alias   = #ffffff,bg:#1e66f5
builtin        = #40a02b
function       = #40a02b
command        = #40a02b
precommand     = #40a02b
hashed-command = #40a02b
single-sq-bracket = #40a02b
double-sq-bracket = #40a02b
double-paren   = #df8e1d

[paths]
path          = #8839ef
pathseparator =
path-to-dir   = #8839ef,underline
globbing      = #1e66f5,bold
globbing-ext  = #8839ef

[brackets]
paired-bracket = bg:#ccd0da
bracket-level-1 = #40a02b,bold
bracket-level-2 = #df8e1d,bold
bracket-level-3 = #179299,bold

[arguments]
single-hyphen-option   = #04a5e5
double-hyphen-option   = #04a5e5
back-quoted-argument   = none
single-quoted-argument = #df8e1d
double-quoted-argument = #df8e1d
dollar-quoted-argument = #df8e1d

[in-string]
back-dollar-quoted-argument           = #04a5e5
back-or-dollar-double-quoted-argument = #04a5e5

[other]
variable             = #1e66f5
assign               = none
assign-array-bracket = #40a02b
history-expansion    = #1e66f5,bold

[math]
mathvar = #1e66f5,bold
mathnum = #8839ef
matherr = #d20f39

[for-loop]
forvar = none
fornum = #8839ef
foroper = #df8e1d
forsep = #df8e1d,bold

[case]
case-input       = #40a02b
case-parentheses = #df8e1d
case-condition   = bg:#ccd0da
