; dark.ini — fast-syntax-highlighting theme matching the Night Owl palette
; (see configs/wezterm/wezterm.lua dark scheme). Loaded via
; `fast-theme CONFIG:dark` from the theme-zsh.zsh hook.
; Values: fg color (hex/name/index), `bg:<color>`, and style flags.

[base]
default          = none
unknown-token    = #ef5350,bold
commandseparator = none
redirection      = none
here-string-tri  = #c5e478
here-string-text = #21c7a8
here-string-var  = #21c7a8,bg:#1d3b53
exec-descriptor  = #c5e478,bold
comment          = #575656,bold
correct-subtle   = #82aaff
incorrect-subtle = #ef5350
subtle-separator = #22da6e
subtle-bg        = bg:#1d3b53
secondary        = free

[command-point]
reserved-word  = #c5e478
subcommand     = #c5e478
alias          = #22da6e
suffix-alias   = #22da6e
global-alias   = bg:#82aaff
builtin        = #22da6e
function       = #22da6e
command        = #22da6e
precommand     = #22da6e
hashed-command = #22da6e
single-sq-bracket = #22da6e
double-sq-bracket = #22da6e
double-paren   = #c5e478

[paths]
path          = #c792ea
pathseparator =
path-to-dir   = #c792ea,underline
globbing      = #82aaff,bold
globbing-ext  = #c792ea

[brackets]
paired-bracket = bg:#1d3b53
bracket-level-1 = #22da6e,bold
bracket-level-2 = #c5e478,bold
bracket-level-3 = #21c7a8,bold

[arguments]
single-hyphen-option   = #21c7a8
double-hyphen-option   = #21c7a8
back-quoted-argument   = none
single-quoted-argument = #c5e478
double-quoted-argument = #c5e478
dollar-quoted-argument = #c5e478

[in-string]
back-dollar-quoted-argument           = #21c7a8
back-or-dollar-double-quoted-argument = #21c7a8

[other]
variable             = #82aaff
assign               = none
assign-array-bracket = #22da6e
history-expansion    = #82aaff,bold

[math]
mathvar = #82aaff,bold
mathnum = #c792ea
matherr = #ef5350

[for-loop]
forvar = none
fornum = #c792ea
foroper = #c5e478
forsep = #c5e478,bold

[case]
case-input       = #22da6e
case-parentheses = #c5e478
case-condition   = bg:#1d3b53
