# picom — minimal X11 compositor. Its one job here is to kill tearing.
#
# Without a compositor anything that draws with plain Xlib — dwm's own bar,
# dmenu, slstatus, and the text path of most terminals — presents
# unsynchronised. With the glx backend and vsync, everything is composited on
# vblank instead.
#
# Deliberately no shadows/fades/blur: Intel UHD 620 on battery, and a tiling WM
# gets nothing from them. Started by profiles/desktop/configs/dwm-session.sh.
# Option reference: /usr/share/doc/picom/examples/picom.sample.conf

# Render on the GPU and present on vblank — the tearing fix itself.
backend = "glx";
vsync = true;

# Hand fullscreen windows back to the X server: video players do their own
# vsync (mpv's vo=gpu does), and it avoids paying for compositing there.
unredir-if-possible = true;

# Only re-render regions that actually changed (battery).
use-damage = true;

# Effects off.
shadow = false;
fading = false;
corner-radius = 0;
frame-opacity = 1.0;

# dwm has no client-side decorations and draws its own bar; leave window
# classification alone beyond transient detection.
detect-transient = true;
