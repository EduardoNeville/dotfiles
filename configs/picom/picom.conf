# picom — minimal X11 compositor. Its one job here is to kill tearing.
#
# Without a compositor anything that draws with plain Xlib — dwm's own bar,
# dmenu, slstatus, and the text path of most terminals — presents
# unsynchronised. With the glx backend and vsync, everything is composited on
# vblank instead.
#
# Deliberately no shadows/fades/blur: Intel UHD 620 on battery, and a tiling WM
# gets nothing from them. Started by profiles/desktop/configs/dwm-session.sh.
# Option reference: /usr/share/doc/picom/examples/picom.sample.conf

# Render on the GPU and present on vblank — the tearing fix itself.
backend = "glx";
vsync = true;

# Keep the compositor in charge even for clients that ask to bypass it
# (_NET_WM_BYPASS_COMPOSITOR = 1: mpv fullscreen — its default is fs-only —
# and most games). Unredirection is screen-wide, not per-window, and this
# display has no TearFree to fall back on (that is an xf86-video-intel option;
# this session runs the modesetting driver), so an unredirected screen has no
# vsync mechanism at all and every window on it tears.
#
# Browsers are unaffected either way: Firefox pins
# _NET_WM_BYPASS_COMPOSITOR = 2, because "Gecko does not align its framebuffer
# updates with vblank" (widget/gtk/nsWindow.cpp) — it needs the compositor.
# Cost of false: fullscreen players pay one extra composite (under a frame).
unredir-if-possible = false;

# Only re-render regions that actually changed (battery).
use-damage = true;

# Effects off.
shadow = false;
fading = false;
corner-radius = 0;
frame-opacity = 1.0;

# dwm has no client-side decorations and draws its own bar; leave window
# classification alone beyond transient detection.
detect-transient = true;
