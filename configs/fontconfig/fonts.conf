<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Text rendering for the 157dpi panel, declared where GTK3 actually looks.

  The X server's Xft.* resources (profiles/desktop/configs/Xresources) cover
  Xft clients — dwm, dmenu, rofi. GTK3 and Firefox chrome bypass them and ask
  fontconfig, so the same antialias/hinting/rgba choices have to be repeated
  here or the two families render differently.

  hintslight + rgba=rgb: sharp edges without the brittle stem weights of full
  hinting. This is a legibility change, not a brightness one — at 250 nits the
  perceived difference comes from glyph edge contrast.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
